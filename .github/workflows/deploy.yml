# Bygger containeren og ruller ut notearkivet.
#
# Hvorfor dette finnes i stedet for Cloudflare Workers Builds:
# containeren maa bygges med Docker foer den kan rulles ut, og
# Cloudflares eget byggemiljoe har ingen Docker:
#
#   «The Docker CLI is needed to build the configured image before
#    deploying but could not be launched.»
#
# GitHub sine kjoerere har Docker installert. Derfor bygges og rulles
# alt ut herfra i stedet.
#
# Krever to hemmeligheter i repoet (Settings -> Secrets and variables
# -> Actions):
#   CLOUDFLARE_API_TOKEN   et token med «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID  3dd864ed35c5a0e46b240c4fe0a7e39f

name: Rull ut notearkivet

on:
  push:
    branches: [main]
  # Lar deg kjoere den manuelt fra Actions-fanen uten aa pushe noe.
  workflow_dispatch:

jobs:
  rull-ut:
    runs-on: ubuntu-latest
    # Foerste bygg henter 150 MB modellvekter inn i imaget.
    timeout-minutes: 60

    steps:
      - name: Hent koden
        uses: actions/checkout@v6

      - name: Vis at Docker finnes
        run: docker version --format 'Docker {{.Server.Version}}'

      - name: Installer avhengigheter
        run: npm ci --no-audit --no-fund

      # Et image som ikke starter, ser helt friskt ut fra utsiden: det
      # bygges, rulles ut, og feiler foerst naar noen skanner — og da
      # som «There is no container instance that can be provided to this
      # Durable Object», som peker helt feil vei. Derfor kjoeres
      # containeren her, og utrullinga skjer bare hvis den svarer.
      - name: Proev at containeren faktisk starter
        run: |
          docker build -t notegjenkjenner-proeve ./container
          docker run -d --name proeve -p 8080:8080 notegjenkjenner-proeve
          klar=
          for i in $(seq 1 60); do
            if curl -sf -m 5 http://localhost:8080/oppe > /dev/null; then klar=ja; break; fi
            if [ -z "$(docker ps -q -f name=proeve)" ]; then break; fi
            sleep 5
          done
          # Finnes BEGGE leserne, og starter tekstleseren i det hele
          # tatt? Uten denne sjekken ville et image uten Audiveris sett
          # helt friskt ut — notene kommer jo — helt til noen lurer paa
          # hvor sangteksten ble av.
          verktoy=
          if [ -n "$klar" ]; then
            verktoy=$(curl -s -m 240 http://localhost:8080/verktoy || true)
            echo "─── verktoey i containeren ───"
            echo "$verktoy"
          fi
          echo "─── containerens egen logg ───"
          docker logs proeve 2>&1 | tail -40
          docker rm -f proeve > /dev/null
          if [ -z "$klar" ]; then
            echo "::error::Containeren svarte ikke paa /oppe. Ingenting rulles ut."
            exit 1
          fi
          case "$verktoy" in
            *'"audiveris": true'*|*'"audiveris":true'*) ;;
            *) # Svaret MAA staa i selve feilmeldinga. Byggeloggen her
               # krever innlogging aa lese, mens annotasjonen er aapen —
               # uten dette ser man bare at det feilet, ikke hvorfor.
               echo "::error::Tekstleseren (Audiveris) starter ikke: $(echo "$verktoy" | tr '\n' ' ' | cut -c1-1400)"
               exit 1 ;;
          esac
          echo "Begge leserne svarer. Ruller ut."

      - name: Bygg containeren og rull ut
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
